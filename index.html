<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product filter using e-commerce website</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="control">
        <div class="btn-group">
            <button class="btn" data-filter="all">All</button>
            <button class="btn" data-filter="pizza">Pizza</button>
            <button class="btn" data-filter="cake">Cake</button>
            <button class="btn" data-filter="icecream">Ice Cream</button>
        </div>
        <input type="text" placeholder="Search food" id="search">
    </div>
    <div class="container">
        <div class="box" data-item="cake">
            <img src="img/c1.jpg">
        </div>
        <div class="box" data-item="cake">
            <img src="img/c2.jpg">
        </div>
        <div class="box" data-item="cake">
            <img src="img/c3.jpg">
        </div>
        <div class="box" data-item="icecream">
            <img src="img/i1.jpg">
        </div>
        <div class="box" data-item="icecream">
            <img src="img/i2.jpg">
        </div>
        <div class="box" data-item="icecream">
            <img src="img/i3.jpg">
        </div>
        <div class="box" data-item="pizza">
            <img src="img/p1.jpg">
        </div>
        <div class="box" data-item="pizza">
            <img src="img/p2.jpg">
        </div>
        <div class="box" data-item="pizza">
            <img src="img/p3.jpg">
        </div>
        <div class="box" data-item="chocolate">
            <img src="img/ch1.jpg">
        </div>
        <div class="box" data-item="chocolate">
            <img src="img/ch2.jpg">
        </div>
        <div class="box" data-item="chocolate">
            <img src="img/ch3.jpg">
        </div>
        <div class="box" data-item="burger">
            <img src="img/b1.jpg">
        </div>
        <div class="box" data-item="burger">
            <img src="img/b2.jpg">
        </div>
        <div class="box" data-item="burger">
            <img src="img/b3.jpg">
        </div>
        <div class="box" data-item="sweets">
            <img src="img/s1.jpg">
        </div>
        <div class="box" data-item="sweets">
            <img src="img/s2.jpg">
        </div>
        <div class="box" data-item="sweets">
            <img src="img/s3.jpg">
        </div>
    </div>
    <script src="js/script.js"></script>
</body>

</html>
